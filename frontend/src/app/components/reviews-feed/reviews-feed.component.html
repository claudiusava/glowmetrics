<div class="strip">
  <ng-container *ngIf="reviews.length > 0; else emptyTpl">
    <div class="cards">
      <div class="card" *ngFor="let r of reviews">
        <div class="pill">#{{ r.number }}</div>
        <div class="author">{{ r.author || 'Anónimo' }}</div>
        <div class="stars" [attr.aria-label]="r.rating + ' estrellas'">{{ stars(r.rating) }}</div>
        <div class="meta">{{ fmtDate(r.publishedAt) }}</div>
        <div class="text" *ngIf="r.text?.trim()">{{ r.text }}</div>
      </div>
    </div>
  </ng-container>

  <ng-template #emptyTpl>
    <div class="empty" *ngIf="!loading">No hay reseñas para mostrar.</div>
  </ng-template>
</div>
