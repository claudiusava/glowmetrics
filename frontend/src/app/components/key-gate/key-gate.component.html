<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form class="box" (ngSubmit)="submit()">
    <div class="lock" aria-hidden="true">🔒</div>
    <h1 id="gate-title">Acceso</h1>
    <p class="text">Escribe la clave para entrar. Solo hace falta <strong>una vez</strong> en este dispositivo.</p>

    <input
      type="password"
      name="clave"
      [(ngModel)]="key"
      autocomplete="current-password"
      placeholder="Clave"
      aria-label="Clave de acceso"
      [disabled]="checking"
      autofocus
    />

    <div class="err" *ngIf="error" role="alert">{{ error }}</div>

    <button type="submit" [disabled]="!key.trim() || checking">
      <span class="spinner" *ngIf="checking"></span>{{ checking ? 'Comprobando…' : 'Entrar' }}
    </button>
  </form>
</div>
