<div class="goalbar" [class.completed]="isCompleted">
  <div class="goal-track">
    <div
      class="goal-fill running"
      [style.width.%]="fillPct"
    ></div>
  </div>
  <span class="goal-knob" [style.left.%]="fillPct"></span>
  <div class="goal-label">
    <span><span class="goal-emoji">🎯</span> {{ countLabel }}</span>
    <span>{{ pctLabel }}</span>
    <span *ngIf="isCompleted" class="goal-trophy">🏆 !OBJETIVO CONSEGUIDO! 🏆</span>
  </div>
  <!-- Solo se ve en modo compacto (móvil): sustituye a la barra y a la etiqueta larga -->
  <div class="goal-compact">
    <span class="goal-emoji">{{ isCompleted ? '🏆' : '🎯' }}</span>
    <span>{{ compactCount }}<span class="goal-words"> reseñas</span></span>
  </div>
</div>
