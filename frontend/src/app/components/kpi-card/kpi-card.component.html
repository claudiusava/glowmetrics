<section class="top" [style.background-color]="bgColor">
  <div class="kpi-card">
    <div class="kpi-layout">
      <div class="kpi-left">
        <div class="kpi-title">Leads citados (Airtable)</div>
        <div class="kpi-value-row">
          <div class="kpi-value">{{ displayValue }}</div>
          <div class="kpi-trend" *ngIf="trend" [class.up]="trend === 'up'" [class.down]="trend === 'down'">
            <span class="trend-arrow">{{ trend === 'up' ? '▲' : '▼' }}</span>
            <span class="trend-delta">{{ trendDeltaLabel }}</span>
          </div>
        </div>
        <div class="kpi-sub">{{ subText }}</div>
        <div class="kpi-cost" *ngIf="cost">
          <div class="cost-line">
            <span class="cost-label">Coste por lead</span>
            <span class="cost-net">{{ cost.lead }}</span>
            <span class="cost-vat">· con IVA <strong>{{ cost.leadVat }}</strong></span>
          </div>
          <div class="cost-line">
            <span class="cost-label">Coste por cita</span>
            <span class="cost-net">{{ cost.cita }}</span>
            <span class="cost-vat">· con IVA <strong>{{ cost.citaVat }}</strong></span>
          </div>
        </div>
      </div>
      <div class="kpi-right">
        <div class="tip-title"><span class="tip-emoji">💡</span> CONSEJOS RÁPIDOS DE VENTAS:</div>
        <div class="tip-text">{{ tip }}</div>
      </div>
    </div>
  </div>
</section>
