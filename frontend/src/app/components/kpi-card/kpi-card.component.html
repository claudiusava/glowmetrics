<section class="top">
  <div class="kpi-card">
    <div class="kpi-title">Leads citados (Airtable)</div>
    <div class="kpi-value-row">
      <div class="kpi-value">{{ displayValue }}</div>
      <div class="kpi-trend" *ngIf="trend" [class.up]="trend === 'up'" [class.down]="trend === 'down'">
        <span class="trend-arrow">{{ trend === 'up' ? '▲' : '▼' }}</span>
        <span class="trend-delta">{{ trendDeltaLabel }}</span>
      </div>
    </div>
    <div class="kpi-sub">{{ subText }}</div>
    <div class="kpi-cost" *ngIf="cost && showCost">
      <div class="cost-line">
        <span class="cost-label">Coste por lead</span>
        <span class="cost-net">{{ cost.lead }}</span>
        <span class="cost-vat">· con IVA <strong>{{ cost.leadVat }}</strong></span>
      </div>
      <div class="cost-line">
        <span class="cost-label">Coste por cita</span>
        <span class="cost-net">{{ cost.cita }}</span>
        <span class="cost-vat">· con IVA <strong>{{ cost.citaVat }}</strong></span>
      </div>
    </div>

    <!-- Escala del indicador: de rojo (menos de 30 %) a verde (40 % o más), con una marca donde estamos -->
    <div class="scale-wrap" *ngIf="kpi">
      <div class="scale-row" aria-hidden="true">
        <span class="lbl">&lt; 30 %</span>
        <div class="scale-track">
          <div class="scale"><i *ngFor="let c of scaleColors" [style.background]="c"></i></div>
          <span class="pin" [style.left.%]="markerPct"></span>
        </div>
        <span class="lbl">40 % &gt;</span>
      </div>
      <div class="scale-msg" *ngIf="message" [style.color]="message.color">{{ message.text }}</div>
    </div>
  </div>

  <div class="tip-card">
    <span class="tip-emoji" aria-hidden="true">💡</span>
    <div>
      <div class="tip-title">Consejo rápido</div>
      <div class="tip-text">{{ tip }}</div>
    </div>
  </div>
</section>
