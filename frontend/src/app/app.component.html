<div class="app">
  <!-- Barra de secciones: al pulsar una, toda la pantalla pasa a esa sección -->
  <nav class="tabbar" role="tablist" aria-label="Secciones" [attr.inert]="rankingOpen ? '' : null">
    <button
      type="button"
      class="tab"
      role="tab"
      *ngFor="let t of tabs"
      [class.on]="view === t.id"
      [attr.aria-selected]="view === t.id"
      (click)="go(t.id)"
    >{{ t.icon }} <span class="long" *ngIf="t.long">{{ t.long }}</span>{{ t.label }}<span class="tab-dot" *ngIf="t.id === 'notas' && hasUnreadNotes && view !== 'notas'" aria-label="Notas nuevas"></span></button>
  </nav>

  <!-- Inicio: KPI y reseñas (se oculta, no se destruye, para no perder el scroll ni repetir el confeti) -->
  <main class="wrap" [class.is-hidden]="view !== 'inicio'">
  <!-- KPI superior -->
  <app-kpi-card [kpi]="kpi" [tip]="currentTip" [showCost]="showCost" [attr.inert]="rankingOpen ? '' : null"></app-kpi-card>

  <!-- Sección inferior -->
  <section class="bottom" [attr.inert]="rankingOpen ? '' : null">
    <div class="header" #bottomHeader>
      <div class="head-left">
        <div class="title-row">
          <div class="title"><span class="live-dot"></span>Últimas reseñas</div>
          <span
            class="badge-today"
            *ngIf="newReviewsCount > 0"
            [attr.title]="newReviewsCount === 1 ? '1 reseña nueva' : newReviewsCount + ' reseñas nuevas'"
            [attr.aria-label]="newReviewsCount === 1 ? '1 reseña nueva' : newReviewsCount + ' reseñas nuevas'"
          >🔥 +{{ newReviewsCount }}</span>
        </div>
        <div class="subtitle">{{ reviewsSubtitle }}</div>
      </div>

      <div class="head-center">
        <app-monthly-goal
          [data]="monthlyGoal"
          (goalCompleted)="onGoalCompleted()"
        ></app-monthly-goal>
      </div>

      <div class="head-right">
        <app-monthly-history
          [history]="monthlyHistory"
          [current]="monthlyGoal"
        ></app-monthly-history>
        <button type="button" class="rank-link" (click)="rankingOpen = true">🏆 Ranking España <span aria-hidden="true">›</span></button>
      </div>
    </div>

    <app-reviews-feed
      [reviews]="reviews"
      [loading]="loadingReviews"
    ></app-reviews-feed>
  </section>
  </main>

  <!-- Resto de secciones -->
  <main class="page" *ngIf="view !== 'inicio'" [attr.inert]="rankingOpen ? '' : null">
    <div class="page-card" [class.wide]="view === 'limpieza'">
      <app-waitlist-board *ngIf="view === 'espera'"></app-waitlist-board>
      <app-cleaning-board *ngIf="view === 'limpieza'"></app-cleaning-board>
      <app-notes-board
        *ngIf="view === 'notas'"
        [notes]="notes"
        [adding]="addingNote"
        [deleting]="deletingNote"
        [editing]="editingNote"
        [editError]="editNoteError"
        [addError]="addNoteError"
        (addNote)="onAddNote($event)"
        (deleteNote)="onDeleteNote($event)"
        (editNote)="onEditNote($event)"
        (editSessionEnded)="editNoteError = null"
      ></app-notes-board>
    </div>
  </main>
</div>

<div class="refresh-toast" *ngIf="refreshToast">{{ refreshToast }}</div>

<app-ranking-modal [open]="rankingOpen" (closeRequested)="rankingOpen = false"></app-ranking-modal>
