<div class="wrap">
  <!-- KPI superior -->
  <app-kpi-card [kpi]="kpi" [tip]="currentTip"></app-kpi-card>

  <!-- Sección inferior -->
  <section class="bottom">
    <div class="header" #bottomHeader>
      <div class="head-left">
        <div class="title-row">
          <div class="title"><span class="live-dot"></span>Últimas reseñas</div>
          <span class="badge-today" *ngIf="newReviewsCount > 0">🔥 +{{ newReviewsCount }} nuevas</span>
        </div>
        <div class="subtitle">{{ reviewsSubtitle }}</div>
      </div>

      <div class="head-center">
        <app-monthly-goal
          [data]="monthlyGoal"
          (goalCompleted)="onGoalCompleted()"
        ></app-monthly-goal>
      </div>

      <div class="head-right">
        <app-monthly-history
          [history]="monthlyHistory"
          [current]="monthlyGoal"
        ></app-monthly-history>
      </div>
    </div>

    <app-reviews-feed
      [reviews]="reviews"
      [loading]="loadingReviews"
    ></app-reviews-feed>
  </section>

  <div class="refresh-toast" *ngIf="refreshToast">{{ refreshToast }}</div>
</div>
