<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GlowMetrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de GlowMetrics: reseñas de Google Maps, objetivo mensual de reseñas y porcentaje de leads citados.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Inter alojada en el propio sitio (misma fuente variable que servía Google Fonts):
       evita pedir CSS y fuente a otro servidor antes de poder pintar. */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url(fonts/inter-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url(fonts/inter-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: #111827;
      background: #f8fafc;
      height: 100vh;
      overflow: hidden;
    }

    /* Modo compacto (misma condición que src/styles/_breakpoints.scss): 100dvh es la
       altura visible real; en el iPhone 100vh incluye la barra de Safari. */
    @media (max-width: 900px), (max-height: 520px) {
      body { height: 100vh; height: 100dvh; }
    }

    /* Pantalla de carga: solo se ve cuando no hay datos guardados (ver el script
       de abajo). Mismo degradado que el icono de la pestaña, con la estrella y un
       destello de luz recorriendo su contorno. Todo en CSS, sin JavaScript. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f7307d 0%, #e0a24f 100%);
      transition: opacity 0.5s ease;
    }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    #splash svg {
      width: min(38vmin, 320px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.18));
      animation: splash-breathe 2.6s ease-in-out infinite;
    }
    .splash-star { fill: #ffffff; }
    .splash-beam { fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .splash-tail {
      stroke: rgba(255, 226, 122, 0.65);
      stroke-width: 2.2;
      stroke-dasharray: 26 74;
      animation: splash-run 2.4s linear infinite;
    }
    .splash-head {
      stroke: #fff4b8;
      stroke-width: 2.8;
      stroke-dasharray: 7 93;
      filter: drop-shadow(0 0 3px #ffd54a) drop-shadow(0 0 7px rgba(255, 255, 255, 0.9));
      animation: splash-run-head 2.4s linear infinite;
    }
    @keyframes splash-run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
    @keyframes splash-run-head { from { stroke-dashoffset: -19; } to { stroke-dashoffset: -119; } }
    @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) {
      #splash svg, .splash-tail, .splash-head { animation: none; }
      .splash-tail { stroke-dasharray: none; }
      .splash-head { display: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando GlowMetrics">
    <svg viewBox="8 7.3 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path class="splash-star" d="M32 13 L36.7 25.8 L50.5 27.3 L39.9 36.1 L43.3 49.6 L32 42 L20.7 49.6 L24.1 36.1 L13.5 27.3 L27.3 25.8 Z"/>
      <path class="splash-beam splash-tail" pathLength="100" d="M32 13 L36.7 25.8 L50.5 27.3 L39.9 36.1 L43.3 49.6 L32 42 L20.7 49.6 L24.1 36.1 L13.5 27.3 L27.3 25.8 Z"/>
      <path class="splash-beam splash-head" pathLength="100" d="M32 13 L36.7 25.8 L50.5 27.3 L39.9 36.1 L43.3 49.6 L32 42 L20.7 49.6 L24.1 36.1 L13.5 27.3 L27.3 25.8 Z"/>
    </svg>
  </div>
  <script>
    // Con una copia guardada de las reseñas (misma clave que snapshot-cache.service.ts)
    // la web pinta datos al instante y la pantalla de carga no hace falta: se quita
    // antes del primer pintado. Sin copia (primera visita) se queda hasta que llegue
    // la primera respuesta con datos; entonces la app la desvanece.
    try {
      var snap = JSON.parse(localStorage.getItem('glowmetrics_snap_v1_reviews'));
      if (snap && snap.reviews && snap.reviews.length) document.getElementById('splash').remove();
    } catch (e) { /* sin localStorage: se queda la pantalla de carga */ }
  </script>
  <app-root></app-root>
</body>
</html>
