name: Ranking mensual de reseñas SinVello!

# El día 1 de cada mes lee las reseñas de Google de los candidatos al top 50 de la
# franquicia (todos los centros cada 6 meses) y deja guardado el top 50 en
# ranking/data/ (ver ranking/README.md).
# También se puede lanzar a mano: pestaña Actions > "Ranking mensual..." > Run workflow.

on:
  schedule:
    - cron: "0 6 1 * *" # día 1 de cada mes, 06:00 UTC (07:00 o 08:00 en España)
  workflow_dispatch:
    inputs:
      completo:
        description: "Leer TODOS los centros (si no, solo los candidatos al top 50)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ranking-mensual
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ranking/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r ranking/requirements.txt
          python -m playwright install --with-deps chromium

      # Termina con error (y GitHub avisa por correo) si falla más del 10 % de los
      # centros: en ese caso NO se publica ranking nuevo y se mantiene el anterior.
      - name: Capturar ranking
        run: python ranking/sinvello_ranking.py ${{ inputs.completo && '--completo' || '' }}

      # "always": aunque la captura falle se guarda el log con lo ocurrido.
      - name: Guardar datos en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking/data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Ranking mensual de reseñas SinVello! ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi
